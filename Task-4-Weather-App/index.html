<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>🌤 Weather Dashboard</h1>

    <div class="search-box">
        <input
            type="text"
            id="cityInput"
            placeholder="Enter city (e.g. Bhubaneswar)"
        >

        <button id="searchBtn">🔍 Search</button>
    </div>

    <div id="weatherCard">

        <h2 id="cityName">Search for a City</h2>

        <!-- Live Date & Time -->
        <p id="dateTime"></p>

        <p>🌡 <strong>Temperature:</strong> <span id="temperature">--</span></p>

        <p>💧 <strong>Humidity:</strong> <span id="humidity">--</span></p>

        <p>💨 <strong>Wind Speed:</strong> <span id="wind">--</span></p>

        <div id="weatherDisplay">
            <span id="weatherIcon">🌤️</span>
            <span id="condition">Weather</span>
        </div>

    </div>

    <footer>
        <p>Made by <strong>Pratham Ray</strong></p>
       
    </footer>

</div>

<script src="script.js"></script>

</body>
</html>
